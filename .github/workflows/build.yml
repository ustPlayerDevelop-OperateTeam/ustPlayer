name: Build / Release

on:
  push:
    # 所有分支提交都会触发构建；v* 标签推送也触发（避免任意 tag 触发）
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    # 所有分支的 PR 都会触发构建
  workflow_dispatch:

# 同一 ref 的并发运行自动取消旧的，避免连续提交时构建堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 构建：所有分支提交 + PR + 手动触发（pass 开头的消息跳过）
  # ============================================================
  build:
    if: |
      github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'pass')
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取短 commit SHA
        id: sha
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 设置 Python 3.13.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"
          architecture: "x64"
          # 依赖实际由下方 uv pip install 安装（另有 uv 专用缓存步骤），
          # 无需再配 pip 缓存

      - name: 缓存 uv 依赖缓存
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: 安装依赖（uv 加速，替代 pip）
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          # 依赖与项目本体统一由 pyproject.toml 声明；
          # uv 并行下载/安装显著快于 pip（PySide6 全家桶尤其明显），
          # 同时安装 build backend（uv_build），Nuitka 可找到 src/ 布局下的 ustplayer 包
          uv pip install --system .

      - name: 运行测试
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          # pytest 在 dev 依赖组，CI 用 uv pip install（不解析 group），故单独安装
          uv pip install --system pytest
          # offscreen 平台由 tests/conftest.py 顶层设置，无显示器也能跑 Qt 测试
          python -m pytest tests/ -v --tb=short

      # ============================================================
      # 检出并编译 uPlRender 渲染器（Rust cdylib → ustplayer_renderer.dll）
      # 产物放到仓库根 renderer/ 目录，供下方 Nuitka include-data-files 打包
      # ============================================================
      - name: 检出 uPlRender 源码
        shell: pwsh
        run: git clone https://github.com/ustPlayerDevelop-OperateTeam/uPlRender.git "${{ runner.temp }}/uPlRender"

      - name: 设置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 uPlRender cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/uPlRender

      - name: 编译 uPlRender 并复制渲染器 DLL
        shell: pwsh
        run: |
          cargo build --release --manifest-path "${{ runner.temp }}/uPlRender/Cargo.toml"
          $dll = Get-ChildItem "${{ runner.temp }}/uPlRender/target/release" -Filter *.dll -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "uPlRender 编译失败：未在 release 目录找到 .dll" }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/renderer" | Out-Null
          Copy-Item $dll.FullName "$env:GITHUB_WORKSPACE/renderer/ustplayer_renderer.dll" -Force
          Get-Item "$env:GITHUB_WORKSPACE/renderer/ustplayer_renderer.dll" | Select-Object Name, Length

      - name: 使用 Nuitka 打包
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: main.py
          nuitka-version: main
          mode: standalone
          output-file: ustPlayer
          # 并行编译：windows-latest 为 4 vCPU
          jobs: 4
          # 编译增量缓存默认开启（disable-cache=false）：Action 内置
          # actions/cache 自动恢复上次构建的 Nuitka 缓存，代码小改动时
          # 只重编受影响的模块，大幅缩短构建时间
          include-data-files: |
            ERcode.txt=ERcode.txt
            LICENSE=LICENSE
            icon.ico=icon.ico
            i18n/ustplayer_zh_CN.qm=i18n/ustplayer_zh_CN.qm
            i18n/ustplayer_en_US.qm=i18n/ustplayer_en_US.qm
            i18n/ustplayer_zh_classic.qm=i18n/ustplayer_zh_classic.qm
            renderer/ustplayer_renderer.dll=renderer/ustplayer_renderer.dll
          windows-icon-from-ico: icon.ico
          enable-plugins: pyside6
          windows-console-mode: disable

      - name: 上传构建产物
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ustPlayer-${{ steps.sha.outputs.short }}-Windows
          path: build/main.dist/
          include-hidden-files: true

  # ============================================================
  # 旧版 → 新版 .uplr 转换器（C++17，windows-latest 自带 MSVC）
  # ============================================================
  uplr-converter:
    if: |
      github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'pass')
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建转换器
        run: |
          cmake -S tools/uplr_converter -B build/converter
          cmake --build build/converter --config Release

      - name: 上传转换器
        uses: actions/upload-artifact@v4
        with:
          name: uplr-converter-Windows
          path: build/converter/Release/uplr_converter.exe

  # ============================================================
  # 发版：v* 标签推送，或任意分支上以 v 开头的提交（pass 开头除外）
  # ============================================================
  release:
    if: |
      (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))) && !startsWith(github.event.head_commit.message, 'pass')
    needs: [build, uplr-converter]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: build/main.dist/

      - name: 下载转换器
        uses: actions/download-artifact@v4
        with:
          name: uplr-converter-Windows
          path: build/converter/

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            full="${{ github.ref_name }}"
          else
            msg="${{ github.event.head_commit.message }}"
            tag=$(echo "$msg" | cut -d' ' -f1)
            full=$(echo "$msg" | tr ' ' '-')
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "file=$(echo "${full}" | tr ' ' '-' | sed 's/Beta/beta/g; s/Alpha/alpha/g')" >> $GITHUB_OUTPUT
          echo "title=${full#v}" >> $GITHUB_OUTPUT
          case "$full" in
            *[Bb]eta*|*[Aa]lpha*) echo "prerelease=true" >> $GITHUB_OUTPUT ;;
            *)                    echo "prerelease=false" >> $GITHUB_OUTPUT ;;
          esac

      - name: 从 CHANGELOG.md 提取版本信息
        id: changelog
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $content = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          # tag 名用连字符（如 v1.1.0-Beta-1），CHANGELOG 标题用空格（如 # v1.1.0 Beta 1）：
          # 转义后把连字符替换成 [ -]（空格或连字符），两种写法都能匹配到对应小节。
          # 注意：.NET 的 Regex.Escape 不转义连字符，需直接对 '-' 做替换
          $pattern = ([regex]::Escape($tag) -replace '-', '[ -]')
          if ($content -match "(?ms)^(# $pattern[^\n]*)\n(.*?)(?=\r?\n# |\Z)") {
              $heading = ($matches[1] -replace '^# v?', '').Trim()
              $section = $matches[2].Trim()
              "Found changelog section for $tag" | Write-Host
          } else {
              $heading = '${{ steps.ver.outputs.title }}'
              $section = "<!-- 未在 CHANGELOG.md 中找到 $tag 的更新说明 -->"
              "WARNING: No changelog section found for $tag" | Write-Host
          }
          $section | Set-Content changelog_body.md -Encoding UTF8
          "title=$heading" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag_name=$($heading -replace ' ', '-')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 打包 ustPlayer 主包（定位产物目录后只打包其内容，不含任何外层目录）
        run: |
          $name = "ustPlayer-${{ steps.ver.outputs.file }}-Windows-x64.zip"
          # download-artifact 解压后 build/main.dist 下可能嵌套一层与 artifact 同名的目录，
          # 因此以 ustPlayer.exe 为锚定位真正的产物目录，再只打包该目录里的内容，
          # 避免把整个 main.dist / artifact 同名目录原样打进发布包
          $exe = Get-ChildItem -Path build/main.dist -Recurse -Filter ustPlayer.exe -File | Select-Object -First 1
          if (-not $exe) {
              throw "未找到 ustPlayer.exe，无法打包"
          }
          $dist = $exe.Directory
          $items = @(Get-ChildItem -Path $dist -Force)
          if ($items.Count -eq 0) {
              throw "产物目录为空，无法打包"
          }
          Compress-Archive -Path $items.FullName -DestinationPath $name -Force
          "Artifact: $name（打包自 $($dist.FullName)）" | Write-Host

      - name: 打包转换器（独立发布，不再并入主包）
        run: |
          $cname = "uplr_converter-${{ steps.ver.outputs.file }}-Windows-x64.zip"
          if (-not (Test-Path "build/converter/uplr_converter.exe")) {
              "WARNING: 未找到 uplr_converter.exe，跳过转换器打包" | Write-Host
              exit 0
          }
          Compress-Archive -Path "build/converter/uplr_converter.exe" -DestinationPath $cname -Force
          "Artifact: $cname" | Write-Host

      - name: 创建 tag（commit 消息触发时）
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          if ! git rev-parse "${{ steps.changelog.outputs.tag_name }}" >/dev/null 2>&1; then
            git tag "${{ steps.changelog.outputs.tag_name }}"
            git push origin "${{ steps.changelog.outputs.tag_name }}"
          fi

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag_name }}
          name: ${{ steps.changelog.outputs.title }}
          body_path: changelog_body.md
          files: |
            ustPlayer-${{ steps.ver.outputs.file }}-Windows-x64.zip
            uplr_converter-${{ steps.ver.outputs.file }}-Windows-x64.zip
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
