# 说明：本仓库现在是**双产品线**（根目录 = C# / Avalonia 2.0 主线，
# pysourcecode/ = 冻结的 1.1.x）。本 workflow 只构建与验证 2.0 主线；
# 1.1.x 的旧 CI 已归档为 pysourcecode/.github/workflows/build.yml
# （GitHub 不执行子目录中的 workflow，仅作存档）。

name: Build / Test

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

# 同一 ref 的并发运行自动取消旧的，避免连续提交时构建堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # CI 上不因 NuGet 警告中断（真正需要拦截的编译警告由 TreatWarningsAsErrors 管）
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
  # 依赖渲染器原生库的测试类。渲染器目前只有 Windows 产物（Spike 0c 待补 macOS/Linux 目标），
  # 因此非 Windows 平台必须排除它们——这些用例在缺库时会**明确失败**（而不是静默跳过），
  # 这是刻意的：宁可 loudly fail 也不要让「渲染器没就位」被掩盖。
  # 新增依赖原生库的测试类时，请一并加到这里：filter 只认 FullyQualifiedName
  # （本 runner 上 [Trait]/TestCategory 过滤无效，已实测）。
  # 必须写成单行：折叠标量（>-）会把换行变成**空格**，而 --filter 表达式里不能有空格。
  NATIVE_ONLY_TESTS_FILTER: "FullyQualifiedName!~RenderBufferBlitTests&FullyQualifiedName!~RendererInteropTests&FullyQualifiedName!~PlayerFrameCompositorTests&FullyQualifiedName!~VideoExportIntegrationTests&FullyQualifiedName!~AudioBackendIntegrationTests"

jobs:
  # ============================================================
  # 快速反馈：Linux 上做 restore / build / 纯托管测试（无原生依赖）
  # ============================================================
  build-and-test:
    name: 构建与测试（Linux 快速反馈）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 还原
        run: dotnet restore UstPlayer.slnx

      - name: 构建（warnings 视为错误已在 Directory.Build.props 配置）
        run: dotnet build UstPlayer.slnx -c Release --no-restore

      - name: 测试（跳过依赖渲染器原生库的用例）
        run: >
          dotnet test UstPlayer.slnx -c Release --no-build --nologo
          --filter "$NATIVE_ONLY_TESTS_FILTER"

  # ============================================================
  # Windows：完整验证 —— 含原生渲染器集成测试与真实窗口启动
  # ============================================================
  windows:
    name: Windows 完整验证（原生 + 启动）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 同步渲染器原生库
        shell: pwsh
        # 优先用仓库内已有副本（由开发者提交前的同步脚本放入，实体不入库故 CI 里通常缺失）；
        # 缺失时脚本以 0 退出，随后依赖它的测试会明确失败并给出指引——
        # 这样「渲染器没就位」不会被静默跳过。
        run: ./build/sync-native-assets.ps1
        continue-on-error: true

      - name: 获取内置 FFmpeg
        shell: pwsh
        # 渲染器编码 MP4 本身就依赖 ffmpeg（只从 PATH 查找），因此导出集成测试需要它。
        # 缺失时本步骤以 0 退出，导出集成测试随后**明确失败**——同样是不静默跳过。
        run: ./build/fetch-ffmpeg.ps1
        continue-on-error: true

      - name: 还原
        run: dotnet restore UstPlayer.slnx

      - name: 构建
        run: dotnet build UstPlayer.slnx -c Release --no-restore

      - name: 测试（全量）
        run: dotnet test UstPlayer.slnx -c Release --no-build --nologo

      - name: 真实窗口启动验证
        shell: pwsh
        # AppWindow 在 headless 平台无法实例化（见 docs/adr-0002-window-chrome.md），
        # 因此窗口的创建与显示只能以真实进程启动验证。
        run: ./build/verify-app-launch.ps1 -Configuration Release

      - name: 真实播放链路验证
        shell: pwsh
        # 同上：播放窗口也是 AppWindow，无法在 headless 下构造。
        # 本步骤用 --play 真跑一遍：UST 解析 → 渲染器出帧 → 显示 → 首帧已渲染 → 播放进行中。
        run: ./build/verify-player-launch.ps1 -Configuration Release

  # ============================================================
  # macOS / Linux：验证跨平台可构建性 + 纯托管测试
  # 渲染器原生库目前只有 Windows 产物（Spike 0c 待补目标），故过滤 RequiresNative
  # ============================================================
  cross-platform:
    name: 跨平台构建（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 还原
        run: dotnet restore UstPlayer.slnx

      - name: 构建
        run: dotnet build UstPlayer.slnx -c Release --no-restore

      - name: 测试（跳过依赖原生渲染器的用例）
        run: >
          dotnet test UstPlayer.slnx -c Release --no-build --nologo
          --filter "$NATIVE_ONLY_TESTS_FILTER"

  # ============================================================
  # Android 头：**刻意不在解决方案里**
  # 本机无法验证它（见 docs/plan-deviations.md D1：workload 已装，但 Android SDK
  # 自动安装在该机器上失败）。若把它放进 UstPlayer.slnx，`dotnet build UstPlayer.slnx`
  # 会在没有 Android SDK 的机器上每次失败——这正是 D1 当初不建工程的原因。
  # ubuntu runner 预装 Android SDK，因此由这个作业承担它的首次真实编译验证。
  # ============================================================
  android:
    name: Android 头构建（ubuntu，含 Android SDK）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 安装 Android workload
        run: dotnet workload install android

      # 单独构建该工程（它不在解决方案里，原因见上）
      - name: 构建 Android 头
        run: dotnet build ustPlayer.Android/ustPlayer.Android.csproj -c Release

  # ============================================================
  # 打包：每次推送都真的打一次包，确认产物完整
  # 这一环刻意放在日常 CI 而不是只在发版时跑：
  # 「资源没打进产物」本仓库踩过多次（翻译 .ts、ERcode.txt / Terms.txt），
  # 而它不会报错、只在用户机器上表现为功能静默失效。日常跑一次最便宜。
  # ============================================================
  package:
    name: 打包产物校验（Windows）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 同步渲染器原生库
        shell: pwsh
        run: ./build/sync-native-assets.ps1
        continue-on-error: true

      - name: 获取内置 FFmpeg
        shell: pwsh
        run: ./build/fetch-ffmpeg.ps1
        continue-on-error: true

      # publish.ps1 会逐项校验产物里该有的文件（可执行文件、三份 .ts、
      # ERcode.txt / Terms.txt / LICENSE、Windows 上的渲染器与 ffmpeg），缺一个就失败。
      - name: 打包并校验产物
        shell: pwsh
        run: ./build/publish.ps1 -RuntimeIdentifier win-x64

      # 即使打包校验失败也把目录传上来，便于事后看清到底缺了什么
      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ustPlayer-win-x64
          path: artifacts/ustPlayer-win-x64/
          if-no-files-found: warn

  # ============================================================
  # 发版：只由标签推送触发
  # 版本号**全部从 tag 推导**（tag 就是版本），因此不需要在仓库里另存一份
  # 「2.0 从哪个版本起」的配置；`-p:Version=` 会把版本写进程序集，
  # 与 CHANGELOG 的小节标题各自独立、不会互相矛盾。
  # 1.1.x 的 CI 已归档在 pysourcecode/.github/（GitHub 不执行子目录 workflow），
  # 因此当前**所有**标签都属于 2.0 线，不存在两条线抢标签的问题。
  # ============================================================
  release:
    name: 发版（标签驱动）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 同步渲染器原生库
        shell: pwsh
        run: ./build/sync-native-assets.ps1
        continue-on-error: true

      - name: 获取内置 FFmpeg
        shell: pwsh
        run: ./build/fetch-ffmpeg.ps1
        continue-on-error: true

      # 标签名直接当版本号传进程序集
      - name: 打包并校验产物
        shell: pwsh
        run: ./build/publish.ps1 -RuntimeIdentifier win-x64 -Version "${{ github.ref_name }}"

      # 提取 CHANGELOG 小节；找不到对应小节会以非 0 退出，
      # 从而**中止发版**而不是发布占位内容（与 1.1.x 的行为一致）。
      - name: 提取发布说明
        shell: pwsh
        run: >
          ./build/extract-release-notes.ps1
          -Tag "${{ github.ref_name }}"
          -Artifacts artifacts/*.zip
          -OutputFile release-notes.md

      # 先建草稿：发版说明与附件需要人工过目后再手动 Publish
      - name: 创建草稿 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --draft
          --title "${{ github.ref_name }}"
          --notes-file release-notes.md
          artifacts/*.zip
